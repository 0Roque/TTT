<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Table Tennis Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .find{max-width:560px;margin:12vh auto 0;text-align:center;padding:0 16px}
  .find .ball{width:44px;height:44px;margin:0 auto 18px}
  .find h1{font-size:28px;font-weight:400;margin:0 0 6px}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:24px;padding:4px 4px 4px 20px;margin-top:24px;background:var(--surface)}
  .search:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
  #code{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--ink);font:15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;padding:8px 0}
  .search .btn{border-radius:20px}
  .count{font-size:12px;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<form class="find" id="f" novalidate>
  <div class="ball"></div>
  <h1>Table Tennis Tournament</h1>
  <div class="hint">Enter the 32-character code you received from the organiser.</div>
  <div class="search">
    <input type="text" id="code" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tournament code" aria-label="Tournament code">
    <button class="btn pri" type="submit">View</button>
  </div>
  <div class="count" id="count">0 / 32</div>
  <div class="err" id="err"></div>
</form>
<script src="assets/vault.js"></script>
<script>
"use strict";
const CODE_RE = /^[a-z0-9]{32}$/;
const inp = document.getElementById("code"), err = document.getElementById("err"), count = document.getElementById("count");
inp.addEventListener("input", () => { inp.value = inp.value.toLowerCase().replace(/[^a-z0-9]/g, ""); count.textContent = `${inp.value.length} / 32`; err.textContent = ""; });
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const code = inp.value.trim().toLowerCase();
  if(!CODE_RE.test(code)){ err.textContent = "A tournament code is exactly 32 letters (a–z) and digits."; return; }
  try{
    const r = await fetch(`${await Vault.fileUrl(code)}?v=${Date.now()}`, {method:"HEAD", cache:"no-store"});
    if(r.status === 404){ err.textContent = "No tournament found with this code."; return; }
  }catch(_){ /* network hiccup: let the tournament page report it */ }
  location.href = `tournament.html#${code}`;
});
const q = location.hash.slice(1);
if(q){ inp.value = q; inp.dispatchEvent(new Event("input")); }
inp.focus();
</script>
</body>
</html>
